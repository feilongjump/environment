# 新项目编排片段模板：复制本目录（projects/_demo/）为 projects/<name>/ 后按需修改
# 本目录是模板，不会被根 docker-compose.yml include，不要在服务器上直接启动
#
# 约定：
#   1. 服务名/容器名带项目前缀（如 otb-api），避免多项目重名
#   2. 编排变量（端口/重启策略）放根 .env；密钥放 api/.env，由 env_file 直接注入容器
#   3. 产物由应用仓库 CI 直传：二进制到 api/、前端到 web/（纯产物目录），挂载使用，零自定义镜像构建
#   4. 业务数据统一放 ./data、运行日志放 ./logs（均已 gitignore；备份 = 拷 data/）
#   5. 需要共享数据库时在服务里声明 networks: [env_net]，用 mysql:3306 / postgres:5432 直连
services:
  demo-api:                              # 改名：<name>-api
    image: alpine:3                      # 产物直传模式示例：基础镜像 + 挂载产物
    container_name: demo-api             # 改名，与服务名保持一致
    restart: ${DEMO_RESTART:-unless-stopped}   # 前缀改名；根 .env 加 <NAME>_RESTART=unless-stopped
    working_dir: /app
    command: ["/app/demo-api", "-config", "/app/config.prod.yaml"]
    env_file: ./api/.env                 # 项目密钥（模板见 api/.env.example）；文件缺失时 up 会报错，属预期
    environment:                         # environment 优先级高于 env_file，固定值放这里
      TZ: Asia/Shanghai
    volumes:
      - ./api:/app:ro                    # CI 直传的二进制 + 版本化的 config.prod.yaml（目录挂载，mv 替换对容器可见）
      - ./data:/app/data                 # 业务数据（备份 = 拷此目录）
      - ./logs:/app/logs                 # 运行日志（不入库，无需备份）
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${DEMO_API_PORT:-9400}:8080"    # 前缀改名；根 .env 加 <NAME>_API_PORT=<端口>
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # 需要共享 MySQL/PostgreSQL 时取消注释（根 compose 已统一定义 env_net）：
    # networks:
    #   - env_net

# 需要 nginx 反代前端时，参照 projects/otb/compose.yml 的 otb-web 服务：
# 前端产物直传 ./web（纯产物目录，整目录 gitignore，CI 就地替换内容），
# nginx.conf 放项目根（版本化，勿放 web/ 里——会被 CI 替换覆盖），
# 挂载 ../_shared:/etc/nginx/shared:ro 后在项目 nginx.conf 里 include 公共片段
