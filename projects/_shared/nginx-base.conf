# 公共 nginx 配置片段：各项目 server 块内 include 使用
# 用法：include /etc/nginx/shared/base.conf;
#
# ⚠️ nginx 继承规则提醒：proxy_set_header / add_header 这类指令，
#    location 内一旦自定义任意一条，外层（本文件）的同名指令对该 location 全部失效。
#    因此各项目的 location 内不要重复写 proxy_set_header；若确需自定义，请自行补全。

# 隐藏版本号
server_tokens off;

# gzip 压缩
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
gzip_min_length 1k;
gzip_vary on;

# 上传体积上限（富文本插图/文件上传）
client_max_body_size 20m;

# 安全响应头（注意：location 内自定义 add_header 会导致本组不继承，如 /assets/ 长缓存段——静态资源无妨）
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# 公共反代请求头（各项目 location 继承此组，勿在 location 内重写）
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id $request_id;
