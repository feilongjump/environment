# 启步校服商城（单商户 B2C：小程序下单 + 到店自提核销）：被根 docker-compose.yml include
# 形态 B 单二进制：管理后台前端经 go:embed 打进 Go 静态二进制（sum），页面与 API 同端口。
# 小程序产物不入服务器（经微信开发者工具上传微信平台）。
# HTTPS（2026-10-27）：sum-web（nginx）进驻 80/443 证书终止并反代 sum-api；
#   证书 acme.sh HTTP-01 自动续期（宿主 crontab），域名 qibu888.cn（已备案）。
# 部署链路：school-uniform-mall 仓库 GitHub Actions 交叉编译 Linux 二进制 →
#   scp 到本目录 api/sum → restart 本服务
services:
  sum-api:
    image: alpine:3
    container_name: sum-api
    restart: ${SUM_RESTART:-unless-stopped}
    working_dir: /app
    command: ["/app/api/sum", "-config", "/app/api/config.prod.yaml"]
    env_file: ./api/.env            # 密钥（JWT_SECRET / DATABASE_DSN），模板见 api/.env.example
    environment:                    # environment 优先级高于 env_file，固定值放这里
      TZ: Asia/Shanghai
    volumes:
      - ./api:/app/api:ro           # CI 直传的 Linux 二进制 + 版本化 config.prod.yaml（mv 替换对容器可见）
      - ./data:/app/data            # 业务数据：上传图片等（备份 = 拷此目录）
      - ./logs:/app/logs            # 运行日志
      - /etc/localtime:/etc/localtime:ro
      # alpine 裸镜像无 tzdata，只设 TZ 会静默跑 UTC（根 README 已知坑）；
      # 商城订单/售后带本地时间语义，补挂 zoneinfo 使 TZ 生效
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    ports:
      - "${SUM_PORT:-9422}:8080"    # 页面与 API 同端口（管理后台浏览器直连）
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - env_net                     # 共享 postgres（env_net 直连 postgres:5432，库 school_uniform_mall）

  # HTTPS 前置网关：80 跳转/ACME 验证 + 443 证书终止，全量反代 sum-api（后端路由自带 /api 前缀）
  # 证书在宿主 ./certs/（acme.sh 自动续期 + reloadcmd restart sum-web，不入库）
  sum-web:
    image: nginx:alpine
    container_name: sum-web
    restart: ${SUM_RESTART:-unless-stopped}
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - /var/www/acme:/var/www/acme:ro          # ACME HTTP-01 续期验证目录
      - ../_shared:/etc/nginx/shared:ro          # 公共 gzip/安全头/反代头片段
    ports:
      - "80:80"
      - "443:443"
    networks:
      - env_net
