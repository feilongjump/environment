# OTB 前端 nginx 配置：托管 web/ 静态文件 + 反代后端 API
# 本文件在 environment 仓库版本化；改动后在服务器执行 docker compose restart otb-web 生效
# 公共配置（gzip/安全头/反代请求头）见 projects/_shared/nginx-base.conf
server {
    listen 80;
    server_name _;
    # compose 将宿主 ./web 挂到 /srv/web（web/ 是挂载点本身，CI 就地替换内容后即时生效）
    root /srv/web;
    index index.html;

    # 公共片段：gzip / 安全头 / client_max_body_size / 公共 proxy_set_header
    include /etc/nginx/shared/base.conf;

    # 上传文件/后端静态资源（相对路径 /uploads/xxx.jpg，后端实现后生效）
    location /uploads/ {
        proxy_pass http://otb-api:8080;
    }

    # API 反代：前端 axios baseURL 为 /api，后端路由不带 /api 前缀，必须 rewrite 剥掉
    # proxy_set_header 继承公共片段（location 内一旦自定义会致其全部失效，勿加）
    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://otb-api:8080;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # SPA 路由回退（刷新深层路由不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长缓存（注意：本段的 add_header 使公共安全头在此 location 不生效，静态资源无妨）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
