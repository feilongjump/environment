# Environment 总编排：共享基础设施 + include 各项目片段
# 新项目接入：projects/<name>/ 下建 compose.yml，并在下方 include 列表登记
# ⚠️ 操作纪律：所有 compose 命令必须带服务名（up -d <svc> / restart <svc>），
#    禁止裸 docker compose down —— 会停掉本机全部项目
name: environment

include:
  - projects/otb/compose.yml
  - projects/flowstock/compose.yml
  - projects/retail-integration/compose.yml

services:
  mysql:
    # 最新的 LTS 版本是 9.7 （~2034年4月）
    # 另外的 LTS 版本是 8.4 （~2032年4月）
    image: mysql:9.7
    container_name: mysql
    restart: ${MYSQL_RESTART}
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - ${MYSQL_VOLUMES}:/var/lib/mysql
    networks:
      - env_net

  postgres:
    # 这里只标注了 18 的版本，后续的子版本自动升级是可以接受的
    # 子版本的更新，仅用于修复Bug和解决安全问题
    # 如果无法接受这种，那就带上子版本号 18.x
    image: postgres:18
    container_name: postgres
    restart: ${POSTGRES_RESTART}
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${POSTGRES_VOLUMES}:/var/lib/postgresql
    networks:
      - env_net

volumes:
  mysql_data:
  postgres_data:

networks:
  env_net:
    driver: bridge
    name: env_net
