# OTB 前端 nginx 配置：托管 dist 静态文件 + 反代后端 API
# 本文件在 environment 仓库版本化；改动后在服务器执行 docker compose restart otb-web 生效
server {
    listen 80;
    server_name _;
    # compose 将宿主 ./app 挂到 /srv/app（父目录挂载，保证 CI 原子替换 dist 后立即生效）
    root /srv/app/dist;
    index index.html;

    # 上传文件/后端静态资源（相对路径 /uploads/xxx.jpg，后端实现后生效）
    location /uploads/ {
        proxy_pass http://otb-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API 反代：前端 axios baseURL 为 /api，后端路由不带 /api 前缀，必须 rewrite 剥掉
    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://otb-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # SPA 路由回退（刷新深层路由不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
