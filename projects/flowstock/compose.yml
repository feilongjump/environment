# FlowStock 进销存（华强北 MLCC 小店）：被根 docker-compose.yml include
# 产物直传模式：前端经 go:embed 打进 Go 静态二进制，单服务同时提供页面与 /api，
# 无需 nginx 容器（比 otb 少一个服务）。
# 部署链路：flow_stock 仓库 GitHub Actions 交叉编译 Linux 二进制 → scp 到本目录 api/ → restart 本服务
# 2026-09-07 数据库切换为 SQLite-only（应用内置纯 Go 驱动，不再连接 postgres）：
#   - DB_FILE 固定为 /app/data/flowstock.db，挂宿主持久卷 ./api/data
#   - api/.env 里的 DATABASE_URL/DB_DRIVER 已失效（应用不再读取），保留无害
services:
  flowstock-api:
    image: alpine:3
    container_name: flowstock-api
    restart: ${FLOWSTOCK_RESTART:-unless-stopped}
    working_dir: /app
    command: ["/app/api/flowstock"]
    env_file: ./api/.env            # 密钥（JWT_SECRET），模板见 api/.env.example
    environment:                    # environment 优先级高于 env_file，固定值放这里
      TZ: Asia/Shanghai
      DB_FILE: /app/data/flowstock.db   # SQLite 数据文件（宿主卷持久化）
    volumes:
      - ./api:/app/api:ro           # CI 直传的 Linux 二进制（mv 替换对容器可见）
      - ./api/data:/app/data        # SQLite 数据持久卷
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${FLOWSTOCK_PORT:-9420}:8081"   # 页面与 API 同一端口（浏览器直连即可）
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - env_net
