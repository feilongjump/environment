# 应用生产配置模板：键名随应用自定义，但【路径约定】固定，与 compose 挂载一一对应：
#   ./api  → /app（本文件即 /app/config.prod.yaml，compose 启动命令引用此路径）
#   ./data → /app/data（业务数据，备份对象）
#   ./logs → /app/logs（运行日志，应用内滚动切割，无需备份）
server:
  port: 8080
  mode: release

database:
  dsn: /app/data/demo.db            # SQLite 放 data/；接共享 MySQL 则改为 mysql:3306 连接串

log:
  level: info
  format: json
  file: /app/logs/demo-api.log      # 日志一律写 /app/logs/ 下，勿写 /app/data/
  max_size_mb: 100
  max_backups: 7
  max_age_days: 30
