# OTB 项目（采购预算系统）：被根 docker-compose.yml include
# 产物直传模式：现成基础镜像 + 挂载 CI 直传的产物，零自定义镜像构建
#   otb-api：alpine 挂载 Go 静态二进制（otb-api CI 交叉编译后 scp 到 api/）
#   otb-web：nginx 挂载前端产物（otb-web CI 打包后 scp 到 web/，就地替换内容）
# 完整部署流程见 otb-api 仓库 docs/deploy.md
services:
  otb-api:
    image: alpine:3
    container_name: otb-api
    restart: ${OTB_RESTART:-unless-stopped}
    working_dir: /app
    command: ["/app/api/otb-api", "-config", "/app/api/config.prod.yaml"]
    env_file: ./api/.env           # 项目密钥（OTB_JWT_SECRET/OTB_ADMIN_PASSWORD），模板见 api/.env.example
    environment:                   # environment 优先级高于 env_file，固定值放这里
      TZ: Asia/Shanghai            # 定时任务（每日 02:30）按本地时间执行
    volumes:
      # ./api 挂在 /app/api 而非 /app：/app 若整体只读挂载，Docker 将无法在其下
      # 创建 /app/data、/app/logs 的嵌套挂载点（实测报 read-only file system）
      - ./api:/app/api:ro          # CI 直传的二进制 + 版本化的 config.prod.yaml（目录挂载，mv 替换对容器可见）
      - ./data:/app/data           # SQLite 业务数据（备份 = 拷此目录）
      - ./logs:/app/logs           # 运行日志（应用内滚动切割，无需备份）
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${OTB_API_PORT:-9418}:8080" # API 直连端口（调试/健康检查）；页面流量走 otb-web 反代
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  otb-web:
    image: nginx:stable-alpine
    container_name: otb-web
    restart: ${OTB_RESTART:-unless-stopped}
    depends_on:
      - otb-api
    volumes:
      # web/ 是容器挂载点本身：CI 只能就地替换其内容，
      # 若 mv 整目录替换，容器仍指向旧 inode（与旧 app/dist 父目录挂载方案的区别）
      - ./web:/srv/web:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro  # 改动后需 compose restart otb-web
      - ../_shared:/etc/nginx/shared:ro                 # 公共 nginx 片段（gzip/安全头/反代头）
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${OTB_WEB_PORT:-5918}:80"   # 前端页面对外端口
