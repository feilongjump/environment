# 启步校服商城 nginx（sum-web）：80 跳转/ACME + 443 HTTPS 反代 sum-api
# 本文件在 environment 仓库版本化；改动后在服务器 docker compose restart sum-web 生效
# 公共片段（gzip/安全头/反代请求头）见 projects/_shared/base.conf
# 证书由 acme.sh（宿主 root crontab）经 HTTP-01 webroot 自动续期，
#   续期目录 /var/www/acme，renew 后 reloadcmd 自动 restart sum-web

# ===== 80：证书验证 + 全站跳 HTTPS =====
server {
    listen 80;
    server_name qibu888.cn;

    # Let's Encrypt HTTP-01 验证（acme.sh --webroot /var/www/acme）
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ===== 443：HTTPS 正式服务 =====
server {
    listen 443 ssl;
    http2 on;
    server_name qibu888.cn;

    ssl_certificate     /etc/nginx/certs/fullchain.cer;
    ssl_certificate_key /etc/nginx/certs/qibu888.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 公共片段：gzip / 安全头 / client_max_body_size / 公共 proxy_set_header
    include /etc/nginx/shared/base.conf;

    # 单二进制形态：后台页面/管理 API(/api)/小程序 API(/api/app) 全在 sum-api，
    # 后端路由自带 /api 前缀，无需 rewrite，全量反代即可。
    # proxy_set_header 继承公共片段（location 内一旦自定义会致其全部失效，勿加）
    location / {
        proxy_pass http://sum-api:8080;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
